<div class="w-full h-screen overflow-auto flex items-center justify-center">
  <hlm-card class="w-full max-w-120">
    <hlm-card-header>
      <h3 hlmCardTitle>Register</h3>
      <p hlmCardDescription>Enter your credentials to create an account</p>
      <div hlmCardAction>
        <a hlmBtn variant="link" [routerLink]="['/auth/login']">Login</a>
      </div>
    </hlm-card-header>

    <!-- Form  -->
    <div hlmCardContent>
      <form [formRoot]="form" id="form-register">
        <hlm-field-group>
          <!-- Email -->
          <hlm-field>
            <label hlmFieldLabel for="email">Email</label>
            <input
              id="email"
              hlmInput
              placeholder="mail@example.com"
              type="email"
              autocomplete="new-email"
              [formField]="form.email"
            />
            @for (error of form.email().errors(); track error) {
              <hlm-field-error [validator]="error.kind">
                {{ error.message }}
              </hlm-field-error>
            }
          </hlm-field>

          <!-- Password  -->
          <hlm-field>
            <label hlmFieldLabel for="password">Password</label>
            <hlm-input-group>
              <input
                id="password"
                hlmInputGroupInput
                placeholder="********"
                autocomplete="new-password"
                [formField]="form.password"
                [type]="_isPasswordVisible() ? 'text' : 'password'"
              />
              <hlm-input-group-addon align="inline-end">
                <button
                  hlmInputGroupButton
                  aria-label="Toggle password visibility"
                  title="Toggle password visibility"
                  size="icon-xs"
                  (click)="_togglePasswordVisibility()"
                >
                  <ng-icon [name]="_isPasswordVisible() ? 'lucideEye' : 'lucideEyeOff'" />
                </button>
              </hlm-input-group-addon>
            </hlm-input-group>
            @for (error of form.password().errors(); track error) {
              <hlm-field-error [validator]="error.kind">
                {{ error.message }}
              </hlm-field-error>
            }
          </hlm-field>
        </hlm-field-group>
      </form>
    </div>

    <!-- Register button -->
    <hlm-card-footer>
      <button
        hlmBtn
        type="submit"
        form="form-register"
        class="w-full"
        [disabled]="form().submitting() || form().invalid()"
      >
        Register
      </button>
    </hlm-card-footer>
  </hlm-card>
</div>
